# SPDX-License-Identifier: MPL-2.0
name: free-threaded CPython
on: [push, pull_request]
jobs:
  cpython-314t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - run: python -m pip install --upgrade pip maturin pytest -r test/requirements.txt
      - name: Build without free-threaded opt-in
        run: python -m pip install --no-build-isolation .
      - name: Check GIL and tests
        env:
          PYTHON_GIL: "0"
        run: |
          python -c 'import sys, orjson; assert not sys._is_gil_enabled(); assert orjson.loads(orjson.dumps({"x": 1})) == {"x": 1}'
          python -m pytest -q test
          ./integration/run thread
